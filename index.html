<style>
@font-face{font-family:"Zen Maru Gothic";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ZenMaruGothic-Regular.woff2") format("woff2")}
@font-face{font-family:"Zen Maru Gothic";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/ZenMaruGothic-Bold.woff2") format("woff2")}
:root{--bg:#FAF8F3;--text:#1F1F1F;--link:#3F7F32;--line:#DDD8CC}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.85;word-break:break-word}
main{max-width:720px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:26px;line-height:1.4;margin:0 0 12px}
h2{font-size:20px;line-height:1.5;margin:36px 0 8px}
h3{font-size:17px;line-height:1.5;margin:24px 0 6px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:1.4em}
li{margin:4px 0}
a{color:var(--link);text-decoration:underline}
hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.table-wrap{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{background:#F1EDE2}
th:first-child,td:first-child{white-space:nowrap}
.back{margin:0 0 20px;font-size:14px}
</style>
</head>

</html>
